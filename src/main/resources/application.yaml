spring:
  application:
    name: ASE-UserService
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:h2:file:./data/mydb
    driverClassName: org.h2.Driver
    username: sa
    password: password
server:
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health,readiness,liveness,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
app:
  apis:
    student-service:
      baseurl: https://sau-portal.de/api/v1/exagrad/student
    exam-service:
      baseurl: https://sau-portal.de/exa-grad/exam-service
    courses-service:
      baseurl: https://sau-portal.de/api/masterdata/studies
    student-data-service:
      baseurl: https://sau-portal.de/team-11-api/api/v1
    bitfrost:
      baseurl: https://bitfrost.sau-portal.de/api/v1/messages/publish
      secret: ${BITFROST_TOPIC_LECTURER_SECRET}
      tag: ExaGrad-Lecturer-Service
  cors:
    allowed-origins:
      - http://localhost:5173
      - https://sau-portal.de
